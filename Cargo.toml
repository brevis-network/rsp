[workspace]
members = [
    "bin/host",
    "bin/continuous",
    "bin/ethproofs",
    "bin/eth-proofs",
    "crates/executor/client",
    "crates/executor/host",
    "crates/guest-mem",
    "crates/mpt",
    "crates/primitives",
    "crates/provider",
    "crates/storage/rpc-db",
    "crates/storage/witness-db",
]
# The evm2 checkout the Pico guest builds against (bin/client-pico/prepare-evm2.sh) is a
# workspace of its own.
exclude = ["bin/client-pico/evm2-pico"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
authors = ["puma314", "jtguibas", "rkrasiuk"]
repository = "https://github.com/moongate-forks/minimal-reth"
homepage = "https://github.com/moongate-forks/minimal-reth"
exclude = ["**/target"]
version = "0.1.0"

[workspace.dependencies]
tracing = { version = "0.1.40", default-features = false }
cfg-if = "1.0.0"
spin = { version = "0.9.8", features = ["mutex"] }
async-trait = "0.1.80"
tokio = { version = "1.21", default-features = false, features = [
    "rt",
    "rt-multi-thread",
] }
reqwest = "0.12.9"
serde_json = "1.0.94"
serde = { version = "1.0", default-features = false, features = ["derive"] }
futures = "0.3"
url = "2.3"
thiserror = "1.0.61"
hex-literal = "0.4.1"
rayon = "1.10.0"
rlp = "0.5.2"

# arena mpt
bumpalo = { version = "3.19.0", features = ["collections"] }
smallvec = "1.13"
bytes = "1"

# workspace
rsp-rpc-db = { path = "./crates/storage/rpc-db" }
rsp-witness-db = { path = "./crates/storage/witness-db" }
rsp-client-executor = { path = "./crates/executor/client" }
rsp-host-executor = { path = "./crates/executor/host" }
rsp-mpt = { path = "./crates/mpt" }
rsp-primitives = { path = "./crates/primitives" }
rsp-provider = { path = "./crates/provider" }


# sp1
sp1-build = "=6.10.0"
# Only needed by bin/host for `SyscallCode` (the per-syscall CSV columns); not re-exported by
# sp1-sdk. The `bigint-rug` (GMP) acceleration lives on `sp1-sdk` below so every binary gets it.
sp1-core-executor = "=6.10.0"
# `bigint-rug` routes GMP-backed bignum into the shared `sp1-curves` build (feature-unified across
# the executor and prover), speeding up the elliptic-curve precompiles that Ethereum blocks lean on.
sp1-sdk = { version = "=6.10.0", features = ["bigint-rug"] }

# reth
reth-primitives-traits = { version = "0.8.2", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-consensus-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-trie = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
# The guest-side crates use this one directly: from reth v2.11.0 on `reth-trie` depends on
# `reth-tasks` (tokio, thread priorities), which does not build for a zkVM target.
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false, features = [
    "serde",
] }

# evm2: the EVM reth uses from v2.9.0 on, at the revision reth v2.11.0 pins
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475", default-features = false }

# alloy
alloy-chains = { version = "0.2.33", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
] }
alloy-provider = { version = "2.5.0", default-features = false, features = [
    "reqwest",
    "reqwest-rustls-tls",
] }
alloy-rpc-types = { version = "2.5.0", default-features = false, features = [
    "eth",
] }
alloy-rpc-types-debug = { version = "2.5.0", default-features = false }

alloy-json-rpc = { version = "2.5.0", default-features = false }
alloy-genesis = { version = "2.5.0", default-features = false, features = [
    "serde-bincode-compat",
] }
alloy-consensus = { version = "2.5.0", default-features = false, features = [
    "serde",
    "serde-bincode-compat",
] }
alloy-network = { version = "2.5.0", default-features = false }
alloy-transport = { version = "2.5.0", default-features = false }
alloy-transport-http = { version = "2.5.0", features = [
    "reqwest-rustls-tls",
], default-features = false }
alloy-transport-ws = { version = "2.5.0" }
alloy-rpc-client = { version = "2.5.0", default-features = false }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-eip7928 = { version = "0.4.10", default-features = false, features = ["rlp"] }
alloy-serde = "2.5.0"
alloy-rlp = "0.3.16"
alloy-trie = "0.9.9"

# 0.2.8 is the newest version that has a Pico branch; the Pico guest patches it in.
kzg-rs = "0.2.8"

# Precompile cryptography in the versions Pico has accelerated patches for. evm2's own backends
# are newer majors, so `rsp-client-executor` routes the precompiles to these (its `custom.rs`).
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10.9", default-features = false }
# EIP-2537. From git outside the guest as well: the precompile code uses the field types, which
# crates.io's bls12_381 keeps private. `experimental` is `hash_to_curve`'s map_to_curve.
# The lock files pin the branch at 8ce21c5, which maps u = 0 on G2 as RFC 9380 says (79fbbfa
# returned the point at infinity). Do not move them past it before Pico has G2 add and double
# precompiles: from 5dbe03f on, G2 arithmetic in the guest calls `syscall_bls12381_g2_add` and
# `syscall_bls12381_g2_double`, which no pico-sdk defines yet, so the guest would not link.
bls12_381 = { git = "https://github.com/brevis-network/bls12_381", branch = "patch-v1.0.1-rv64", features = ["experimental"] }
# bn254 (EIP-196, EIP-197). From git outside the guest as well: the precompile code adds and
# multiplies affine G1 points, which crates.io's substrate-bn does not offer.
bn = { git = "https://github.com/brevis-network/bn", branch = "patch-v1.0.2-rv64", package = "substrate-bn" }


[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rustdoc.all = "warn"

# Same redirections as reth v2.11.0's own manifest.
[patch."https://github.com/alloy-rs/evm2"]
evm2 = { git = "https://github.com/DaniPopes/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475" }

[patch.crates-io]
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-rpc-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
# Precompile patches
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.10.0", package = "sha2" }
bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.1-sp1-6.10.0", package = "substrate-bn-succinct-rs" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.10.0-substrate-bn" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.10.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.10.0" }
