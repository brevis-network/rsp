[package]
name = "rsp-rpc-db"
description = ""
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
bincode.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

rsp-mpt.workspace = true
rsp-primitives.workspace = true

async-trait.workspace = true

# reth
reth-storage-errors.workspace = true

# revm
revm-database.workspace = true
revm-database-interface.workspace = true
revm-primitives.workspace = true
revm-state.workspace = true

# alloy
alloy-consensus = { workspace = true, optional = true }
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rlp = { workspace = true, optional = true }
alloy-rpc-types-debug = { workspace = true, optional = true }
alloy-transport.workspace = true
alloy-trie = { workspace = true, optional = true, features = ["ethereum"] }

[features]
default = ["execution-witness"]
execution-witness = [
    "alloy-provider/debug-api",
    "dep:alloy-consensus",
    "dep:alloy-rlp",
    "dep:alloy-rpc-types-debug",
    "dep:alloy-trie",
]
