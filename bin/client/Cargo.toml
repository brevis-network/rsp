[workspace.package]
[package]
name = "reth-pico"
description = ""
edition = "2021"

[dependencies]
# workspace
rsp-client-executor = { path = "../../crates/executor/client", default-features = false, features = ["native-keccak"] }
rsp-mpt = { path = "../../crates/mpt", default-features = false, features = ["native-keccak"] }

# pico
pico-sdk = { git = "https://github.com/brevis-network/pico", branch = "rv64" }
# local debug
# pico-sdk = { path = "../../../brevis-vm/sdk/sdk" }

# misc
bincode = "1.3.3"

[patch.crates-io]
# precompile patches
bls12_381 = { git = "https://github.com/brevis-network/bls12_381", branch = "patch-v1.0.1-rv64" }
bn = { git = "https://github.com/brevis-network/bn", package = "substrate-bn", branch = "patch-v1.0.2-rv64" }
k256 = { git = "https://github.com/brevis-network/elliptic-curves", branch = "k256-0.13.4-rv64" }
p256 = { git = "https://github.com/brevis-network/elliptic-curves", branch = "p256-0.13.2-rv64" }
sha2 = { git = "https://github.com/brevis-network/hashes.git", package = "sha2", branch = "sha2-0.10.9-rv64" }
sha3 = { git = "https://github.com/brevis-network/hashes.git", branch = "sha3-0.10.8-v1.0.0-rv64" }
tiny-keccak = { git = "https://github.com/brevis-network/tiny-keccak", branch = "patch-v1.0.0-rv64" }

# local debug
# bls12_381 = { path = "../../../pico-patches/bls12_381" }
# bn = { path = "../../../pico-patches/bn", package = "substrate-bn" }
# k256 = { path = "../../../pico-patches/k256/k256" }
# p256 = { path = "../../../pico-patches/p256/p256" }
# sha2 = { path = "../../../pico-patches/sha2/sha2" }
# sha3 = { path = "../../../pico-patches/sha3/sha3" }
# tiny-keccak = { path = "../../../pico-patches/tiny-keccak" }

# revm patches
revm = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-bytecode = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-context = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-database = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-database-interface = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-handler = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-inspector = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-interpreter = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-precompile = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-primitives = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }
revm-state = { git = "https://github.com/brevis-network/revm", branch = "pico-v98-31-0-2" }

# elf optimization
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
embed-bitcode = true
