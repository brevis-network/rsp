[package]
version = "0.1.0"
name = "eth-proofs"
edition = "2021"
license.workspace = true
publish.workspace = true

# The long-running service: follows the chain, builds each sampled block's client input and hands
# it to the PicoProver gRPC service of brevis-vm.
[[bin]]
name = "eth-proofs"
path = "src/main.rs"

# A stand-in for that prover which runs the client natively instead of proving it.
[[bin]]
name = "native-prover"
path = "src/bin/native-prover.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
url.workspace = true
tracing.workspace = true
serde_json.workspace = true
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
dotenv = "0.15.0"
clap = { version = "4.5.7", features = ["derive", "env"] }
eyre = "0.6.12"
reqwest = { workspace = true, features = ["json"] }
reqwest-middleware = { version = "0.3.3", features = ["json"] }
reqwest-retry = "0.6.1"
base64 = "0.22.1"
bincode = "1.3.3"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# workspace
rsp-host-executor.workspace = true
rsp-client-executor.workspace = true
rsp-primitives.workspace = true
rsp-provider.workspace = true

# reth
reth-chainspec.workspace = true

# alloy
alloy-network.workspace = true
alloy-provider = { workspace = true, features = ["ws"] }

# the PicoProver gRPC service
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.13", features = ["zstd"] }

[build-dependencies]
tonic-build = { version = "0.13", features = ["prost"] }

[features]
default = []
# The witness the host emits. It has to be the one the guest ELF in the prover was built with;
# the Pico guest that ships is built with `flat`. With neither, the host emits the pointer-based
# state of the default backend.
arena = ["rsp-host-executor/arena", "rsp-client-executor/arena"]
flat = ["rsp-host-executor/flat", "rsp-client-executor/flat"]
