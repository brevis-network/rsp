[package]
version = "0.1.0"
name = "pico-processor"
edition = "2021"

[dependencies]
# members
rsp-client-executor.workspace = true
rsp-host-executor.workspace = true
rsp-provider.workspace = true

# pico
pico-sdk.workspace = true
pico-vm.workspace = true

# alloy
alloy-chains.workspace = true
alloy-provider.workspace = true

# misc
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
rustls.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true

[features]
default = ["execution-witness"]
# execution-witness feature enables `debug_executionWitness` RPC call
execution-witness = ["rsp-host-executor/execution-witness"]
