name: CI

# The host workspace links a revm nine commits behind the guest's, so no host test here
# exercises the code the guest ships. Structural, not a stale pin: the guest's revm needs the
# RV64 `[patch.crates-io]` entries in `bin/client/Cargo.toml`, and against the crates.io
# `substrate-bn` the host resolves, `revm-precompile` does not compile ("cannot add `AffineG1`
# to `AffineG1`"). Closing it means giving the host workspace the guest's patch set.

on:
  push:
    branches: [pico, pico-rv64]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Never `+nightly`: it picks up whatever `nightly` happens to be, which cannot compile
      # revm. Let `rust-toolchain.toml`'s pin apply.
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # No `-D warnings`: some lints here are deliberate RV64 codegen choices
      # (`manual_is_multiple_of` on the alignment tests). This job is for the deny-by-default
      # lints.
      - run: cargo clippy --workspace --all-targets

  check:
    name: check (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Excluded, not skipped: these need live `RPC_<chain_id>` endpoints. Still compiled above.
      - run: cargo test --workspace --exclude rsp --exclude rsp-host-executor

  lock-files:
    name: lock files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Three workspaces, three lockfiles: a `crates/` dependency change not reflected in the
      # guest's means host and guest link different graphs. `--locked` rather than `cargo tree` +
      # `git status`, which rewrites the lockfile it is auditing and then reports its own rewrite.
      - run: |
          cargo tree --locked > /dev/null
          (cd ./bin/client && cargo tree --locked > /dev/null)
          (cd ./bin/client-op && cargo tree --locked > /dev/null)

      # A report, not a gate: `cargo tree` never re-resolves a pinned revision, so the step above
      # goes green on the revm split, and gating on a divergence that cannot be closed from here
      # (see the header) would mean an always-red job.
      - name: report the revm revision each workspace links
        run: |
          rev() {
            grep -m1 -o 'brevis-network/revm?branch=[^#]*#[0-9a-f]*' "$1" | sed 's/.*#//' ||
              echo "<none>"
          }
          host=$(rev Cargo.lock)
          guest=$(rev bin/client/Cargo.lock)
          echo "host  workspace revm: $host"
          echo "guest workspace revm: $guest"
          if [ "$host" != "$guest" ]; then
            echo "::warning::host and guest link different revm revisions" \
                 "($host vs $guest), so no host test here exercises the code the guest ships"
          fi

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` is affordable here, unlike `clippy`: no rustdoc lint is an RV64 choice.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  guest:
    name: build the guest ELF
    # The only job that compiles guest-only code: a type error under `cfg(target_os = "zkvm")`
    # leaves every job above green. Opt-in because the `pico` toolchain and `cargo-pico` are
    # installed from a local path and pinned nowhere — set `PICO_TOOLCHAIN_AVAILABLE` on a
    # runner that has them.
    if: ${{ vars.PICO_TOOLCHAIN_AVAILABLE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Not `cargo pico build`: it silently ignores the `--rustflags` this build depends on and
      # produces a correct but ~1 % slower guest.
      - run: ./bin/client/build-guest.sh
