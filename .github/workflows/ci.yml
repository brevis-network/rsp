# The checks of this fork on its Pico branches. Upstream's `pr.yml` and `cycle-tracking.yml` are
# not kept: they build the SP1 guest with SP1's toolchain, on Succinct's runners. Neither is
# `deny.yml`: `deny.toml` has not been brought to this branch's dependencies yet, and a check
# that is always red hides the one that turns red.
name: CI

on:
  push:
    branches: ["pico-**"]
  pull_request:
    branches: ["pico-**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # cargo then runs the toolchain rust-toolchain.toml names.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # eth-proofs compiles its gRPC definitions when it is built.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # `-p` rather than `--workspace`: the SP1 binaries need SP1's toolchain, and their tests
      # an Ethereum RPC.
      - run: cargo test --release -p rsp-mpt -p rsp-client-executor -p rsp-guest-mem
      - run: cargo test --release -p rsp-client-executor --features flat
      - run: cargo test --release -p eth-proofs --features flat

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
